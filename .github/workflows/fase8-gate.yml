name: Phase 8 Home Gate

on:
  push:
    branches:
      - main
      - chore/fase8-validation-gate
      - fix/fase8-hero-official-asset
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fase8-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Provision debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Assemble debug
        run: gradle assembleDebug --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppPRL09-Fase8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-ui-gate:
    needs: android-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Provision debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Run Home Compose tests on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            # Android 15 may attempt cloud integrity verification for adb installs.
            # The ephemeral CI emulator has no Play Store session, so it can time out
            # before the instrumentation APK is installed.
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            gradle connectedDebugAndroidTest --stacktrace
