name: Phase 8 Home Gate

on:
  push:
    branches:
      - main
      - chore/fase8-validation-gate
      - fix/fase8-hero-official-asset
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fase8-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Provision debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Assemble debug
        run: gradle assembleDebug --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppPRL09-Fase8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-ui-gate:
    needs: android-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Provision debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Home Compose tests on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 is stable on GitHub runners and avoids the Android 15 ADB
          # verifier failure (exit 224) seen with the headless API 35 image.
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          # Supplying this input replaces the action defaults, so keep the
          # complete headless option set. Missing -no-window caused the AVD
          # to wait for a graphical display and eventually time out.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 2; done
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            gradle connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AppPRL09-instrumentation-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
